<svg xmlns="http://www.w3.org/2000/svg" width="504" height="656" viewBox="0 0 504 656" role="img" aria-labelledby="title description">
  <title id="title">Which document wins?</title>
  <desc id="description">Three retrievers seek one winner. A and B both start with document 8. C has yet to reply. In a vote with mutable lists, if C votes 7 and A replaces 8 with 7, document 7 leads by two votes to one. With stable pages and C returning only 7, two legal endings give different winners under equal-weight reciprocal rank fusion. With a disjoint shard for C, 8 already has 2/61. All challengers score at most 2/62 or 1/61.</desc>
  <rect width="504" height="656" fill="#FAFAFA"/>
  <g font-family="'Instrument Sans',Arial,sans-serif" fill="#141619">
    <text x="24" y="42" font-size="30" font-weight="600">Which document wins?</text>
    <text x="24" y="72" font-size="18" fill="#555C65">A and B return document 8 first. C has yet to reply.</text>
    <g font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="18">
      <text x="24" y="108">A [8]</text><text x="171" y="108">B [8]</text><text x="321" y="108">C pending</text>
    </g>
    <path d="M24 129h456M24 276h456M24 459h456" stroke="#DADDE1" stroke-width="1.5"/>

    <text x="24" y="171" font-size="25" font-weight="600">RankPatch</text>
    <text x="24" y="202" font-size="18">C votes for 7. Then A replaces its first choice.</text>
    <g font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="19">
      <text x="24" y="246">A [8]</text><path d="M96 240h44m-7-6 7 6-7 6" stroke="#555C65" stroke-width="1.7" fill="none"/>
      <text x="156" y="246">A [7]</text><text x="280" y="246" fill="#315BFF">7 leads, 2 to 1</text>
    </g>

    <text x="24" y="318" font-size="25" font-weight="600">RankSeal</text>
    <text x="24" y="348" font-size="18">Pages are stable. C returns only 7.</text>
    <path d="M36 395h13c15 0 15-17 30-17h7M49 395c15 0 15 19 30 19h7" stroke="#555C65" stroke-width="1.6" fill="none"/>
    <circle cx="33" cy="395" r="4" fill="#141619"/>
    <text x="99" y="384" font-size="18">A and B stop.</text><text x="99" y="420" font-size="18">Both add 7, then stop.</text>
    <g font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="18" fill="#315BFF">
      <text x="381" y="384">8 wins</text><text x="381" y="420">7 wins</text>
    </g>

    <text x="24" y="501" font-size="25" font-weight="600">RankFence</text>
    <text x="24" y="531" font-size="18">C has a disjoint shard. Document 8 already wins.</text>
    <path d="M277 548v62" stroke="#DADDE1" stroke-width="1.5"/>
    <g font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="17">
      <text x="24" y="568" fill="#315BFF">A + B</text><text x="297" y="568" fill="#315BFF">C</text>
    </g>
    <text x="24" y="597" font-size="17">8 has 2/61. Others ≤ 2/62.</text><text x="297" y="597" font-size="17">Any ID ≤ 1/61.</text>
    <text x="24" y="635" font-size="16" fill="#555C65">Each RRF contribution is 1/(60 + rank), starting at rank 1.</text>
  </g>
</svg>
