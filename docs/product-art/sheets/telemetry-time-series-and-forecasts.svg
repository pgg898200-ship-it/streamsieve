<svg xmlns="http://www.w3.org/2000/svg" width="720" height="588" viewBox="0 0 720 588" role="img" aria-labelledby="title desc">
  <title id="title">Telemetry, time series and forecasts</title>
  <desc id="desc">Backfold. A correction at the second event branches from the original timeline to a revised summary below. StreamSieve. Three telemetry channels enter a brief. A selected channel retains a handle back to its samples. ChronoSieve. A series shifts from one level to another. A blue bracket marks the changed interval for a digest. CausalSieve. Three aligned telemetry channels shift at different times. The earlier upstream candidate is highlighted for investigation. FlashMP. Two repeated subsequences align across an observed series. Blue brackets identify their locations. tsjit. A fixed context window feeds a forecast with a fixed horizon. The blue continuation is the prediction. RecastCRPS. An ensemble member shifts relative to the observation. The remaining forecast members keep their positions.</desc>
  <rect width="720" height="588" fill="#FAFAFA" />
  <svg viewBox="0 0 96 96" role="img" x="57" y="12" width="126" height="126" aria-hidden="true">
    <title>A correction at the second event branches from the original timeline to a revised summary below.</title>
    <path d="M12 27H80" fill="none" stroke="#141619" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round" />
    <circle cx="12" cy="27" r="3.7" fill="#141619" />
    <circle cx="52" cy="27" r="3.7" fill="#141619" />
    <circle cx="68" cy="27" r="3.7" fill="#141619" />
    <rect x="75" y="22" width="10" height="10" fill="none" stroke="#555C65" stroke-width="2.5" />
    <path d="M32 32V58Q32 66 40 66H76" fill="none" stroke="#315BFF" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
    <rect x="27" y="22" width="10" height="10" fill="#FAFAFA" stroke="#315BFF" stroke-width="3" />
    <rect x="75" y="60" width="12" height="12" fill="#315BFF" />
  </svg>
  <text x="120" y="164" font-size="22" font-family="'Instrument Sans', Arial, sans-serif" fill="#141619" font-weight="600" text-anchor="middle">Backfold</text>
  <svg viewBox="0 0 96 96" role="img" x="297" y="12" width="126" height="126" aria-hidden="true">
    <title>Three telemetry channels enter a brief. A selected channel retains a handle back to its samples.</title>
    <path d="M12 24h7l4 -4 5 8 4 -6 8 2" fill="none" stroke="#141619" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M12 46h7l4 -4 5 8 4 -6 8 2" fill="none" stroke="#141619" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M12 68h7l4 -4 5 8 4 -6 8 2" fill="none" stroke="#141619" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M45 16v59" fill="none" stroke="#DADDE1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M45 46h8l6-12h21" fill="none" stroke="#315BFF" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" />
    <rect x="57" y="53" width="25" height="4" fill="#141619" />
    <rect x="57" y="62" width="18" height="4" fill="#555C65" />
    <circle cx="80" cy="34" r="4" fill="#315BFF" />
  </svg>
  <text x="360" y="164" font-size="22" font-family="'Instrument Sans', Arial, sans-serif" fill="#141619" font-weight="600" text-anchor="middle">StreamSieve</text>
  <svg viewBox="0 0 96 96" role="img" x="537" y="12" width="126" height="126" aria-hidden="true">
    <title>A series shifts from one level to another. A blue bracket marks the changed interval for a digest.</title>
    <path d="M11 63l6 -4 5 5 5 -7 5 4 6 -2 6 3 6 -5 4 -20 6 -4 5 3 6 -7 5 6 7 -3" fill="none" stroke="#141619" stroke-width="3.1" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M53 22v-5h29v5" fill="none" stroke="#315BFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M53 70h29" fill="none" stroke="#315BFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
    <rect x="53" y="68" width="5" height="5" fill="#315BFF" />
  </svg>
  <text x="600" y="164" font-size="22" font-family="'Instrument Sans', Arial, sans-serif" fill="#141619" font-weight="600" text-anchor="middle">ChronoSieve</text>
  <path d="M12 196h216" stroke="#DADDE1" />
  <svg viewBox="0 0 96 96" role="img" x="57" y="208" width="126" height="126" aria-hidden="true">
    <title>Three aligned telemetry channels shift at different times. The earlier upstream candidate is highlighted for investigation.</title>
    <path d="M12 30H26l4 -10h50" fill="none" stroke="#141619" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" />
    <circle cx="30" cy="20" r="3.5" fill="#315BFF" />
    <path d="M12 54H47l4 -10h29" fill="none" stroke="#141619" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" />
    <circle cx="51" cy="44" r="3.5" fill="#555C65" />
    <path d="M12 77H64l4 -10h12" fill="none" stroke="#141619" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" />
    <circle cx="68" cy="67" r="3.5" fill="#555C65" />
    <path d="M30 31V77" fill="none" stroke="#315BFF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 5" />
  </svg>
  <text x="120" y="360" font-size="22" font-family="'Instrument Sans', Arial, sans-serif" fill="#141619" font-weight="600" text-anchor="middle">CausalSieve</text>
  <path d="M252 196h216" stroke="#DADDE1" />
  <svg viewBox="0 0 96 96" role="img" x="297" y="208" width="126" height="126" aria-hidden="true">
    <title>Two repeated subsequences align across an observed series. Blue brackets identify their locations.</title>
    <path d="M11 52l7 3 5 -20 7 15 5 -7 5 4 6 3 7 7 4 -4 6 -20 7 15 5 -7 7 4" fill="none" stroke="#141619" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M16 67v5h22v-5 M58 67v5h22v-5" fill="none" stroke="#315BFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M16 24h22 M58 24h22" fill="none" stroke="#DADDE1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
  </svg>
  <text x="360" y="360" font-size="22" font-family="'Instrument Sans', Arial, sans-serif" fill="#141619" font-weight="600" text-anchor="middle">FlashMP</text>
  <path d="M492 196h216" stroke="#DADDE1" />
  <svg viewBox="0 0 96 96" role="img" x="537" y="208" width="126" height="126" aria-hidden="true">
    <title>A fixed context window feeds a forecast with a fixed horizon. The blue continuation is the prediction.</title>
    <path d="M11 60l8 -11 8 5 9 -17 8 9 8 -4" fill="none" stroke="#141619" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M52 42l9 4 9 -13 11 -1" fill="none" stroke="#315BFF" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M52 18v46" fill="none" stroke="#555C65" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 5" />
    <path d="M11 69v6h39v-6 M55 69v6h26v-6" fill="none" stroke="#555C65" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
  </svg>
  <text x="600" y="360" font-size="22" font-family="'Instrument Sans', Arial, sans-serif" fill="#141619" font-weight="600" text-anchor="middle">tsjit</text>
  <path d="M12 392h216" stroke="#DADDE1" />
  <svg viewBox="0 0 96 96" role="img" x="57" y="404" width="126" height="126" aria-hidden="true">
    <title>An ensemble member shifts relative to the observation. The remaining forecast members keep their positions.</title>
    <path d="M12 59H84" fill="none" stroke="#555C65" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M19 53v13" fill="none" stroke="#141619" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M30 53v13" fill="none" stroke="#141619" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M58 53v13" fill="none" stroke="#141619" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M75 53v13" fill="none" stroke="#141619" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M45 54v11" fill="none" stroke="#DADDE1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M46 44h16m-5-4 6 4-6 4" fill="none" stroke="#315BFF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M63 53v13" fill="none" stroke="#315BFF" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M38 20l5 8H33Z" fill="#141619" />
    <path d="M38 32v35" fill="none" stroke="#555C65" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 5" />
  </svg>
  <text x="120" y="556" font-size="22" font-family="'Instrument Sans', Arial, sans-serif" fill="#141619" font-weight="600" text-anchor="middle">RecastCRPS</text>
</svg>
