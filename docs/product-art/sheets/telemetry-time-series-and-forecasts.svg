<svg xmlns="http://www.w3.org/2000/svg" width="780" height="690" viewBox="0 0 780 690" role="img" aria-labelledby="title desc">
  <title id="title">Telemetry, time series and forecasts</title>
  <desc id="desc">Backfold. A replacement panel slots into a folded history while the surrounding readings stay in place. StreamSieve. Several telemetry channels pass through a sieve, and a marked strip carries the changed channel’s samples. ChronoSieve. A change rings a bell, representing the compact digest that can wake a monitoring agent. CausalSieve. A marked upstream domino leads two later changes, illustrating how CausalSieve ranks incident candidates. FlashMP. Two impressions show the same subsequence shape at different levels and amplitudes. tsjit. One incoming reading feeds a fan of nine forecast quantiles. RecastCRPS. One forecast bead moves while the other ensemble members and the observed outcome stay fixed.</desc>
