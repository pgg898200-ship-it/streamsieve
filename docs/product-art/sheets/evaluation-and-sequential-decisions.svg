    <rect x="62" y="20" width="6" height="46" fill="#DADDE1" />
    <rect x="72" y="20" width="6" height="46" fill="#DADDE1" />
    <path d="M12 75H57" fill="none" stroke="#141619" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
