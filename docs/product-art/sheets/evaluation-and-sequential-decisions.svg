<svg xmlns="http://www.w3.org/2000/svg" width="480" height="196" viewBox="0 0 480 196" role="img" aria-labelledby="title desc">
  <title id="title">Evaluation and sequential decisions</title>
  <desc id="desc">Cloture. Five ballots have been read. The fifth locks the leading count, leaving the last two ballots unopened. eproc. A sequential evidence trace crosses a preset stopping boundary. The crossing is marked in blue.</desc>
