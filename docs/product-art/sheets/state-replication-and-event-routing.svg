<svg xmlns="http://www.w3.org/2000/svg" width="780" height="690" viewBox="0 0 780 690" role="img" aria-labelledby="title desc">
  <title id="title">State replication and event routing</title>
  <desc id="desc">Afterkey. Afterkey returns the latest value or deletion for each key changed after a reader’s cursor. Tailstate. Tailstate pages through the latest changed keys in sequence order from a worker’s acknowledged cursor. SinceKit. SinceKit builds one changed-key array, and each reader takes the prefix needed for its checkpoint. Guardshift. Guardshift reports which registered conditions switched on or off after a batch of signal changes. KthWake. KthWake reports when a rolling arrival count crosses a rule’s threshold, including expiration during silence. Pulsefold. Pulsefold tracks deadlines for readers that share a heartbeat but tolerate different amounts of silence. EdgeChime. EdgeChime reports which rectangular zones a moving point enters or leaves between position updates.</desc>
