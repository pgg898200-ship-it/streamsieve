    <path d="M43 48v8h21v-8" fill="none" stroke="#315BFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M13 70H34 M44 70H64 M73 70H82" fill="none" stroke="#DADDE1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
  </svg>
  <text x="360" y="164" font-size="22" font-family="'Instrument Sans', Arial, sans-serif" fill="#141619" font-weight="600" text-anchor="middle">Tailstate</text>
  <svg viewBox="0 0 96 96" role="img" x="537" y="12" width="126" height="126" aria-hidden="true">
