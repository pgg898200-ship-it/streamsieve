<svg xmlns="http://www.w3.org/2000/svg" width="720" height="588" viewBox="0 0 720 588" role="img" aria-labelledby="title desc">
  <title id="title">State replication and event routing</title>
  <desc id="desc">Afterkey. Three writes across two keys reduce to two latest rows. The blue terminal row carries a deletion. Tailstate. A reader cursor separates acknowledged rows from an ordered blue page. Further rows remain available. SinceKit. A single array of changed keys serves three readers. Each reader takes a different prefix. Guardshift. Two conditions change state in opposite directions after the same update batch. KthWake. A moving window contains three event ticks. The blue boundary marks the next expiration while no new events arrive. Pulsefold. One heartbeat starts three deadline intervals. Blue endpoints show when each reader marks it stale. EdgeChime. A point moves through two overlapping rectangular zones. Blue crossings mark changes in membership.</desc>
  <rect width="720" height="588" fill="#FAFAFA" />
  <svg viewBox="0 0 96 96" role="img" x="57" y="12" width="126" height="126" aria-hidden="true">
    <title>Three writes across two keys reduce to two latest rows. The blue terminal row carries a deletion.</title>
    <path d="M14 27H75 M14 59H75" fill="none" stroke="#DADDE1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    <circle cx="24" cy="27" r="4" fill="none" stroke="#555C65" stroke-width="2.5" />
    <circle cx="36" cy="59" r="4" fill="none" stroke="#555C65" stroke-width="2.5" />
    <circle cx="64" cy="27" r="5" fill="#141619" />
    <path d="M66 54l8 9m0-9-8 9" fill="none" stroke="#315BFF" stroke-width="3.8" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M80 19H84V69H80" fill="none" stroke="#141619" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
  </svg>
  <text x="120" y="164" font-size="22" font-family="'Instrument Sans', Arial, sans-serif" fill="#141619" font-weight="600" text-anchor="middle">Afterkey</text>
  <svg viewBox="0 0 96 96" role="img" x="297" y="12" width="126" height="126" aria-hidden="true">
    <title>A reader cursor separates acknowledged rows from an ordered blue page. Further rows remain available.</title>
    <path d="M14 30H82" fill="none" stroke="#141619" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
    <rect x="16" y="24" width="5" height="12" fill="#555C65" />
    <rect x="28" y="24" width="5" height="12" fill="#555C65" />
    <rect x="44" y="22" width="5" height="16" fill="#315BFF" />
    <rect x="57" y="22" width="5" height="16" fill="#315BFF" />
    <rect x="72" y="24" width="5" height="12" fill="#555C65" />
