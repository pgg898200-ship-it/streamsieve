<svg xmlns="http://www.w3.org/2000/svg" width="720" height="196" viewBox="0 0 720 196" role="img" aria-labelledby="title desc">
  <title id="title">Search and retrieval</title>
  <desc id="desc">RankPatch. Two document rows exchange positions after a source revises its ranking. The blue row moves upward. RankSeal. Ranked-score intervals have separated. The blue cutoff lies between the lowest certified top score and the strongest remaining challenger. RankFence. Three shard streams meet a vertical cutoff. Pages beyond it remain unread.</desc>
  <rect width="720" height="196" fill="#FAFAFA" />
  <svg viewBox="0 0 96 96" role="img" x="57" y="12" width="126" height="126" aria-hidden="true">
    <title>Two document rows exchange positions after a source revises its ranking. The blue row moves upward.</title>
    <path d="M12 20H32 M64 20H84" fill="none" stroke="#141619" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M12 72H32 M64 72H84" fill="none" stroke="#141619" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M12 36H32L64 56H84" fill="none" stroke="#141619" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M12 56H32L64 36H84" fill="none" stroke="#315BFF" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />
    <circle cx="12" cy="56" r="4" fill="#315BFF" />
    <circle cx="84" cy="36" r="4" fill="#315BFF" />
  </svg>
  <text x="120" y="164" font-size="22" font-family="'Instrument Sans', Arial, sans-serif" fill="#141619" font-weight="600" text-anchor="middle">RankPatch</text>
  <svg viewBox="0 0 96 96" role="img" x="297" y="12" width="126" height="126" aria-hidden="true">
    <title>Ranked-score intervals have separated. The blue cutoff lies between the lowest certified top score and the strongest remaining challenger.</title>
    <path d="M14 76H82" fill="none" stroke="#DADDE1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M61 24H81 M61 19v10 M81 19v10" fill="none" stroke="#141619" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M42 44H55 M42 39v10 M55 39v10" fill="none" stroke="#141619" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M14 64H32 M14 59v10 M32 59v10" fill="none" stroke="#555C65" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M36 53v20" fill="none" stroke="#315BFF" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
    <circle cx="36" cy="53" r="3" fill="#315BFF" />
  </svg>
  <text x="360" y="164" font-size="22" font-family="'Instrument Sans', Arial, sans-serif" fill="#141619" font-weight="600" text-anchor="middle">RankSeal</text>
  <svg viewBox="0 0 96 96" role="img" x="537" y="12" width="126" height="126" aria-hidden="true">
    <title>Three shard streams meet a vertical cutoff. Pages beyond it remain unread.</title>
    <rect x="12" y="24" width="9" height="8" fill="#141619" />
    <rect x="26" y="24" width="9" height="8" fill="#141619" />
    <rect x="40" y="24" width="9" height="8" fill="#141619" />
    <rect x="54" y="24" width="9" height="8" fill="#DADDE1" />
    <rect x="68" y="24" width="9" height="8" fill="#DADDE1" />
    <rect x="12" y="47" width="9" height="8" fill="#141619" />
    <rect x="26" y="47" width="9" height="8" fill="#141619" />
    <rect x="40" y="47" width="9" height="8" fill="#555C65" />
    <rect x="54" y="47" width="9" height="8" fill="#DADDE1" />
    <rect x="68" y="47" width="9" height="8" fill="#DADDE1" />
    <rect x="12" y="70" width="9" height="8" fill="#141619" />
    <rect x="26" y="70" width="9" height="8" fill="#141619" />
    <rect x="40" y="70" width="9" height="8" fill="#141619" />
    <rect x="54" y="70" width="9" height="8" fill="#DADDE1" />
    <rect x="68" y="70" width="9" height="8" fill="#DADDE1" />
    <path d="M51 14V85" fill="none" stroke="#315BFF" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M48 14h6" fill="none" stroke="#315BFF" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
  </svg>
  <text x="600" y="164" font-size="22" font-family="'Instrument Sans', Arial, sans-serif" fill="#141619" font-weight="600" text-anchor="middle">RankFence</text>
</svg>
