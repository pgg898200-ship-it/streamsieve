<svg xmlns="http://www.w3.org/2000/svg" width="720" height="392" viewBox="0 0 720 392" role="img" aria-labelledby="title desc">
  <title id="title">LLM serving and workflow latency</title>
  <desc id="desc">CachePin. Three requests share a prompt prefix. A blue breakpoint sits where their suffixes diverge. Prefix Atlas. A step curve reaches the target cache hit rate. Blue guides locate the associated capacity. Cutstream. The final bytes of one chunk and the first bytes of the next form a stop string. The output ends at its start. EventFold. Two event frames have the same prefix and suffix. The blue segment is the edit carried between them. Racecurve. Two requests start at different times. The blue backup finishes before the first request. PathProbe DAG. Two dependency paths converge on one task. The blue segment marks the duration being changed.</desc>
  <rect width="720" height="392" fill="#FAFAFA" />
  <svg viewBox="0 0 96 96" role="img" x="57" y="12" width="126" height="126" aria-hidden="true">
    <title>Three requests share a prompt prefix. A blue breakpoint sits where their suffixes diverge.</title>
    <rect x="12" y="25" width="32" height="7" fill="#141619" />
    <rect x="50" y="25" width="31" height="7" fill="none" stroke="#555C65" stroke-width="2.5" />
    <rect x="12" y="47" width="32" height="7" fill="#141619" />
    <rect x="50" y="47" width="23" height="7" fill="none" stroke="#555C65" stroke-width="2.5" />
    <rect x="12" y="69" width="32" height="7" fill="#141619" />
    <rect x="50" y="69" width="35" height="7" fill="none" stroke="#555C65" stroke-width="2.5" />
    <path d="M47 14V83" fill="none" stroke="#315BFF" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M42 13h10l-5 7Z" fill="#315BFF" />
  </svg>
  <text x="120" y="164" font-size="22" font-family="'Instrument Sans', Arial, sans-serif" fill="#141619" font-weight="600" text-anchor="middle">CachePin</text>
  <svg viewBox="0 0 96 96" role="img" x="297" y="12" width="126" height="126" aria-hidden="true">
    <title>A step curve reaches the target cache hit rate. Blue guides locate the associated capacity.</title>
    <path d="M14 16V78H84" fill="none" stroke="#555C65" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M16 69H27V61H40V50H52V36H67V28H83" fill="none" stroke="#141619" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M15 36H52V77" fill="none" stroke="#315BFF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 5" />
    <circle cx="52" cy="36" r="4.5" fill="#315BFF" />
  </svg>
  <text x="360" y="164" font-size="22" font-family="'Instrument Sans', Arial, sans-serif" fill="#141619" font-weight="600" text-anchor="middle">Prefix Atlas</text>
  <svg viewBox="0 0 96 96" role="img" x="537" y="12" width="126" height="126" aria-hidden="true">
    <title>The final bytes of one chunk and the first bytes of the next form a stop string. The output ends at its start.</title>
    <rect x="11" y="27" width="8" height="12" fill="#555C65" />
    <rect x="22" y="27" width="8" height="12" fill="#555C65" />
    <rect x="33" y="27" width="8" height="12" fill="#315BFF" />
    <rect x="44" y="27" width="8" height="12" fill="#315BFF" />
    <rect x="55" y="27" width="8" height="12" fill="#315BFF" />
    <rect x="66" y="27" width="8" height="12" fill="#DADDE1" />
    <rect x="77" y="27" width="8" height="12" fill="#DADDE1" />
    <path d="M41 17V46 M47 17V46" fill="none" stroke="#141619" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
    <rect x="11" y="61" width="8" height="12" fill="#141619" />
    <rect x="22" y="61" width="8" height="12" fill="#141619" />
    <path d="M33 53V80" fill="none" stroke="#315BFF" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M39 67H82" fill="none" stroke="#DADDE1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 5" />
  </svg>
  <text x="600" y="164" font-size="22" font-family="'Instrument Sans', Arial, sans-serif" fill="#141619" font-weight="600" text-anchor="middle">Cutstream</text>
  <path d="M12 196h216" stroke="#DADDE1" />
  <svg viewBox="0 0 96 96" role="img" x="57" y="208" width="126" height="126" aria-hidden="true">
    <title>Two event frames have the same prefix and suffix. The blue segment is the edit carried between them.</title>
    <rect x="12" y="21" width="25" height="13" fill="none" stroke="#141619" stroke-width="3" />
    <rect x="64" y="21" width="17" height="13" fill="none" stroke="#141619" stroke-width="3" />
    <rect x="12" y="62" width="25" height="13" fill="none" stroke="#141619" stroke-width="3" />
    <rect x="64" y="62" width="17" height="13" fill="none" stroke="#141619" stroke-width="3" />
    <rect x="42" y="21" width="16" height="13" fill="#DADDE1" />
    <rect x="42" y="62" width="16" height="13" fill="#315BFF" />
    <path d="M50 39v13m-4-4 4 5 4-5" fill="none" stroke="#315BFF" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" />
  </svg>
  <text x="120" y="360" font-size="22" font-family="'Instrument Sans', Arial, sans-serif" fill="#141619" font-weight="600" text-anchor="middle">EventFold</text>
  <path d="M252 196h216" stroke="#DADDE1" />
  <svg viewBox="0 0 96 96" role="img" x="297" y="208" width="126" height="126" aria-hidden="true">
    <title>Two requests start at different times. The blue backup finishes before the first request.</title>
    <path d="M13 33H78" fill="none" stroke="#141619" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M36 62H64" fill="none" stroke="#315BFF" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M13 25v16 M78 25v16" fill="none" stroke="#141619" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M36 54v16 M64 54v16" fill="none" stroke="#315BFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M14 78H84" fill="none" stroke="#DADDE1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M36 17V48" fill="none" stroke="#555C65" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 5" />
    <circle cx="64" cy="62" r="4" fill="#315BFF" />
  </svg>
  <text x="360" y="360" font-size="22" font-family="'Instrument Sans', Arial, sans-serif" fill="#141619" font-weight="600" text-anchor="middle">Racecurve</text>
  <path d="M492 196h216" stroke="#DADDE1" />
  <svg viewBox="0 0 96 96" role="img" x="537" y="208" width="126" height="126" aria-hidden="true">
    <title>Two dependency paths converge on one task. The blue segment marks the duration being changed.</title>
    <path d="M15 48H26L40 25H60L76 48 M26 48L40 71H60L76 48H84" fill="none" stroke="#141619" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M40 25H60" fill="none" stroke="#315BFF" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />
    <circle cx="15" cy="48" r="4" fill="#141619" />
    <circle cx="40" cy="25" r="4" fill="#315BFF" />
    <circle cx="60" cy="25" r="4" fill="#315BFF" />
    <circle cx="40" cy="71" r="4" fill="#141619" />
    <circle cx="60" cy="71" r="4" fill="#141619" />
    <circle cx="79" cy="48" r="4" fill="#141619" />
  </svg>
  <text x="600" y="360" font-size="22" font-family="'Instrument Sans', Arial, sans-serif" fill="#141619" font-weight="600" text-anchor="middle">PathProbe DAG</text>
</svg>
