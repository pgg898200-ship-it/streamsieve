<svg xmlns="http://www.w3.org/2000/svg" width="780" height="460" viewBox="0 0 780 460" role="img" aria-labelledby="title desc">
  <title id="title">LLM serving and workflow latency</title>
  <desc id="desc">CachePin. A pin holds the shared portion of three stacked prompt sheets at a cache breakpoint. Prefix Atlas. Nested contour lines represent the cache capacities explored for a target prompt-prefix hit rate. Cutstream. A blade cuts a stream at a stop sequence that straddles the seam between two chunks. EventFold. A pleated frame carries a single highlighted edit across successive folds. Racecurve. A backup request starts later and races the first request toward the same deadline. PathProbe DAG. Two dependency paths converge, with one task highlighted for duration analysis.</desc>
