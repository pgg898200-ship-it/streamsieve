<svg xmlns="http://www.w3.org/2000/svg" width="720" height="188" viewBox="0 0 720 188" role="img" aria-labelledby="title description">
  <title id="title">Five operations in the PGG Engineering directory</title>
  <desc id="description">Five independent diagrams show a ranked page, two timers, updates converging on a value, a sampled signal, and a fifth vote completing a tally.</desc>
  <rect width="720" height="188" fill="#FAFAFA"/>
  <path d="M22 126h676" stroke="#DADDE1"/>
  <!-- Each group is usable on its own. The settled state is the source image. -->
  <g id="ranked-pages" fill="none" stroke-linejoin="round">
    <path d="m30 92 67-24 35 12-67 26Z" fill="#FAFAFA" stroke="#555C65" stroke-width="2"/>
    <path d="m30 78 67-24 35 12-67 26Z" fill="#FAFAFA" stroke="#141619" stroke-width="2"/>
    <path d="m30 62 67-24 35 12-67 26Z" fill="#315BFF"/>
    <path d="m55 62 39-14m-25 17 20-7" stroke="#FAFAFA" stroke-width="2"/>
  </g>
  <g id="parallel-timers" stroke="#141619" fill="#FAFAFA" stroke-width="2.5">
    <circle cx="234" cy="68" r="27"/><path d="M234 50v18l11 6" fill="none" stroke="#555C65"/>
    <circle cx="213" cy="81" r="27"/>
    <path d="M213 57v5m24 19h-5m-19 24v-5m-24-19h5" stroke="#DADDE1" stroke-width="2"/>
    <path d="m213 81 13-16" stroke="#315BFF" stroke-width="4"/><circle cx="213" cy="81" r="3" stroke="none" fill="#315BFF"/>
  </g>
  <g id="state-revisions" fill="none" stroke-linecap="round" stroke-width="2.5">
    <path d="M309 48h16c20 0 22 29 42 29h19M309 105h16c20 0 22-28 42-28h19" stroke="#555C65"/>
    <path d="M309 77h92" stroke="#141619"/>
    <g fill="#FAFAFA" stroke="#141619"><circle cx="309" cy="48" r="4.5"/><circle cx="309" cy="77" r="4.5"/><circle cx="309" cy="105" r="4.5"/></g>
    <circle cx="402" cy="77" r="7" fill="#315BFF"/>
  </g>
  <g id="signal-traces" fill="none">
    <path d="M453 96h103" stroke="#DADDE1"/>
    <path d="M453 88h13l8-23 13 38 16-60 15 43 14-13 12 7 12-8" stroke="#141619" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="556" cy="72" r="5.5" fill="#315BFF"/>
  </g>
  <g id="counted-votes" fill="none" stroke="#141619" stroke-width="4">
    <path d="M610 57v45m16-49v45m16-49v45m16-49v45"/>
    <path d="m602 103 67-57" stroke="#315BFF" stroke-width="5.5"/>
  </g>
  <g font-family="'IBM Plex Mono',ui-monospace,'DejaVu Sans Mono',monospace" font-size="21" fill="#141619" text-anchor="middle">
    <text x="81" y="157">rank</text><text x="224" y="157">time</text>
    <text x="355" y="157">sync</text><text x="505" y="157">trace</text><text x="635" y="157">decide</text>
  </g>
</svg>
