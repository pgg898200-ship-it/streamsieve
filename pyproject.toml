[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rankfence"
version = "0.1.0"
description = "Certified early stopping for reciprocal rank fusion over asynchronous ranked streams"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["reciprocal-rank-fusion", "retrieval", "asyncio", "top-k"]

[project.urls]
Homepage = "https://rankfence-pgg.tancurl3.chatgpt.site"
Source = "https://github.com/pgg898200-ship-it/streamsieve/tree/rankfence-v0.1.0"

[project.scripts]
rankfence = "rankfence.__main__:main"

[tool.setuptools]
packages = ["rankfence"]
