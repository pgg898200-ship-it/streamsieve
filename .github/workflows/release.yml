name: Release Wheels, CLI & PyPI Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_* *-manylinux_i686 *-win32 cp313t-*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_TEST_COMMAND: "python -m unittest discover -s {project}/tests -p 'test_*.py'"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist_and_linux_cli:
    name: Build sdist & Linux AVX2 CLI tarball
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build source distribution (sdist)
        run: |
          python3 -m pip install --upgrade build
          python3 -m build --sdist --outdir sdist-out

      - name: Build portable Linux x86_64 AVX2 native CLI binary
        run: |
          make clean
          mkdir -p build cli-out
          g++ -std=c++20 -O3 -mavx2 -mfma -ffp-contract=off -Wall -Wextra -Wpedantic \
            csrc/streamsieve_cli.cpp csrc/streamsieve_capi.cpp -o build/streamsieve -lm
          ./build/streamsieve version
          tar -czf cli-out/streamsieve-linux-x86_64-avx2.tar.gz -C build streamsieve

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: sdist-out/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux
          path: cli-out/*.tar.gz

  build_macos_cli:
    name: Build macOS ARM64 CLI tarball
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build macOS ARM64 native CLI binary
        run: |
          mkdir -p build cli-out
          clang++ -std=c++20 -O3 -ffp-contract=off -Wall -Wextra -Wpedantic \
            csrc/streamsieve_cli.cpp csrc/streamsieve_capi.cpp -o build/streamsieve -lm
          ./build/streamsieve version
          tar -czf cli-out/streamsieve-macos-arm64.tar.gz -C build streamsieve

      - uses: actions/upload-artifact@v4
        with:
          name: cli-macos
          path: cli-out/*.tar.gz

  create_github_release:
    needs: [build_wheels, build_sdist_and_linux_cli, build_macos_cli]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: release-artifacts
        run: sha256sum * > SHA256SUMS

      - name: Create GitHub Release with wheels, sdist, CLI binaries & SHA256SUMS
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true

  publish_pypi:
    needs: [build_wheels, build_sdist_and_linux_cli]
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/streamsieve

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: pypi-artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: pypi-artifacts

      - name: Verify PyPI package artifacts (wheels + sdist only)
        run: ls -la pypi-artifacts/

      - name: Publish wheels & sdist to PyPI (OIDC Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-artifacts/
          skip-existing: true
