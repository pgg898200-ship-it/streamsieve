name: Release Wheels, CLI & PyPI Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_* *-win32"
          CIBW_TEST_COMMAND: "python -m unittest discover -s {project}/tests -p 'test_*.py'"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist_and_cli:
    name: Build sdist & native CLI tarball
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python3 -m pip install --upgrade build
          python3 -m build --sdist

      - name: Build portable x86_64 AVX2 native CLI binary
        run: |
          make clean
          mkdir -p build
          g++ -std=c++20 -O3 -mavx2 -mfma -ffp-contract=off -Wall -Wextra -Wpedantic \
            csrc/streamsieve_cli.cpp csrc/streamsieve_capi.cpp -o build/streamsieve -lm
          ./build/streamsieve version
          tar -czf dist/streamsieve-linux-x86_64-avx2.tar.gz -C build streamsieve

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist-cli
          path: dist/*

  create_github_release:
    needs: [build_wheels, build_sdist_and_cli]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: release-artifacts
        run: sha256sum * > SHA256SUMS

      - name: Create GitHub Release with wheels, CLI binary & SHA256SUMS
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true

  publish_pypi:
    needs: [build_wheels, build_sdist_and_cli]
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/streamsieve

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish wheels & sdist to PyPI (OIDC Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-artifacts/
          skip-existing: true
