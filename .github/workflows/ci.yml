name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native-and-python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            run-sanitizers: true
          - os: ubuntu-latest
            python-version: "3.10"
            run-sanitizers: false
          - os: macos-latest
            python-version: "3.12"
            run-sanitizers: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build native C++20 shared library & CLI
        run: make all test-cpp

      - name: Run AddressSanitizer & UndefinedBehaviorSanitizer tests
        if: matrix.run-sanitizers
        run: make test-san

      - name: Verify strict clang++ -Werror build
        if: matrix.run-sanitizers
        run: |
          clang++ -std=c++20 -O3 -ffp-contract=off -Wall -Wextra -Wpedantic -Werror \
            csrc/streamsieve_cli.cpp csrc/streamsieve_capi.cpp -o build/streamsieve_clang -lm
          ./build/streamsieve_clang version
          rm -f build/streamsieve_clang

      - name: Run zero-dependency Python unit & adversarial breaker suite
        run: PYTHONPATH=python python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify clean pip build & install (zero runtime deps)
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install --no-build-isolation --no-deps .
          python3 -c "import streamsieve as ss; assert ss.version() == ss.__version__ == '0.2.0'; print('Installed OK, AVX2=', ss.has_avx2())"
          streamsieve version

  windows-msvc:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Windows AVX2 DLL & install wheel (zero runtime deps)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-build-isolation --no-deps .
          python -c "import streamsieve as ss; assert ss.version() == ss.__version__ == '0.2.0'; print('Windows OK, AVX2=', ss.has_avx2())"

      - name: Run Python unit & adversarial breaker suite on Windows
        run: python -m unittest discover -s tests -p "test_*.py" -v
