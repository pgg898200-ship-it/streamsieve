<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 405" width="560" height="405" role="img" aria-labelledby="title desc">
<title id="title">Afterkey: three writes, two rows</title>
  <desc id="desc">The full-feed C++ example saves its reader cursor at revision 1. Revision 2 sets key 3 to 20, revision 3 sets key 7 to 11, and revision 4 deletes key 3. The poll emits two rows in order: revision 3, key 7, value 11; then revision 4, key 3, deleted. The later deletion supersedes the value 20.</desc>
<rect width="560" height="405" fill="#FAFAFA"/>
<text x="25" y="38" font-size="29" font-family="'Instrument Sans', Arial, sans-serif" fill="#141619" font-weight="650" text-anchor="start">Changes after revision 1</text>
<text x="25" y="69" font-size="20" font-family="'Instrument Sans', Arial, sans-serif" fill="#555C65" font-weight="400" text-anchor="start">Three writes</text>
<line x1="25" y1="82" x2="535" y2="82" stroke="#DADDE1" stroke-width="1"/>
<text x="27" y="107" font-size="16" font-family="'Instrument Sans', Arial, sans-serif" fill="#555C65" font-weight="400" text-anchor="start">Revision</text>
<text x="164" y="107" font-size="16" font-family="'Instrument Sans', Arial, sans-serif" fill="#555C65" font-weight="400" text-anchor="start">Key</text>
<text x="277" y="107" font-size="16" font-family="'Instrument Sans', Arial, sans-serif" fill="#555C65" font-weight="400" text-anchor="start">Operation</text>
<text x="27" y="138" font-size="21" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" fill="#141619" font-weight="400" text-anchor="start">2</text>
<text x="164" y="138" font-size="21" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" fill="#141619" font-weight="400" text-anchor="start">3</text>
<text x="277" y="138" font-size="21" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" fill="#141619" font-weight="400" text-anchor="start">set 20</text>
<text x="27" y="174" font-size="21" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" fill="#141619" font-weight="400" text-anchor="start">3</text>
<text x="164" y="174" font-size="21" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" fill="#141619" font-weight="400" text-anchor="start">7</text>
<text x="277" y="174" font-size="21" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" fill="#141619" font-weight="400" text-anchor="start">set 11</text>
<text x="27" y="210" font-size="21" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" fill="#141619" font-weight="400" text-anchor="start">4</text>
<text x="164" y="210" font-size="21" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" fill="#141619" font-weight="400" text-anchor="start">3</text>
<text x="277" y="210" font-size="21" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" fill="#315BFF" font-weight="400" text-anchor="start">delete</text>
<line x1="25" y1="230" x2="535" y2="230" stroke="#DADDE1" stroke-width="1"/>
<text x="25" y="266" font-size="25" font-family="'Instrument Sans', Arial, sans-serif" fill="#141619" font-weight="650" text-anchor="start">Poll result</text>
<text x="25" y="292" font-size="19" font-family="'Instrument Sans', Arial, sans-serif" fill="#555C65" font-weight="400" text-anchor="start">Two rows in last-write order</text>
<line x1="26" y1="310" x2="26" y2="339" stroke="#555C65" stroke-width="4"/>
<text x="44" y="334" font-size="21" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" fill="#141619" font-weight="400" text-anchor="start">r3  /  key 7</text>
<text x="278" y="334" font-size="21" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" fill="#141619" font-weight="600" text-anchor="start">11</text>
<line x1="26" y1="357" x2="26" y2="386" stroke="#315BFF" stroke-width="4" stroke-dasharray="4 2"/>
<text x="44" y="381" font-size="21" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" fill="#141619" font-weight="400" text-anchor="start">r4  /  key 3</text>
<text x="278" y="381" font-size="21" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" fill="#315BFF" font-weight="600" text-anchor="start">deleted</text>
</svg>
